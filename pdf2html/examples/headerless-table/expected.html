<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Headerless Table: Expected Row Preservation</title></head>
<body>
<main>
  <h1>Headerless Table: Expected Row Preservation</h1>
  <p>The source has no established column headings. Do not invent headings from the first data row.</p>
  <table>
    <caption>Synthetic headerless table</caption>
    <tbody>
      <tr><td>2022</td><td>12</td></tr>
      <tr><td>2023</td><td>15</td></tr>
      <tr><td>2024</td><td>19</td></tr>
    </tbody>
  </table>
  <p>Header semantics require review. This example preserves data; it is not a claim of accessibility conformance.</p>
</main>
</body>
</html>
